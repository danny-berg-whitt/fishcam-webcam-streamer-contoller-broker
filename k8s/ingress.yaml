# Template: `make ingress` fills the ${...} placeholders via k8s/render.sh.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webcam-ingress
spec:
  rules:
    - host: ${WEBCAM_HOST}
      http:
        paths:
          # No rewrite: the broker serves ROUTE_PREFIX itself.
          - path: /webcam/mute
            pathType: Exact
            backend:
              service: { name: webcam-broker-service, port: { number: 8082 } }
          - path: /webcam/unmute
            pathType: Exact
            backend:
              service: { name: webcam-broker-service, port: { number: 8082 } }
          - path: /webcam/status
            pathType: Exact
            backend:
              service: { name: webcam-broker-service, port: { number: 8082 } }
          # /webcam/healthz is deliberately unrouted; the kubelet probes the
          # pod directly.
