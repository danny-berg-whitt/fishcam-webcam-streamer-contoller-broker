# A template: ${...} placeholders are filled from deploy.env by k8s/render.sh
# (which `make ingress` runs). Don't apply this file directly.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webcam-ingress
spec:
  rules:
    - host: ${WEBCAM_HOST}
      http:
        paths:
          # The broker serves /webcam itself (ROUTE_PREFIX), the same way
          # the Controller used to — no rewrite in front of it, so the
          # signed/authenticated path and the received path stay identical.
          - path: /webcam/mute
            pathType: Exact
            backend:
              service: { name: webcam-broker-service, port: { number: 8082 } }
          - path: /webcam/unmute
            pathType: Exact
            backend:
              service: { name: webcam-broker-service, port: { number: 8082 } }
          - path: /webcam/status
            pathType: Exact
            backend:
              service: { name: webcam-broker-service, port: { number: 8082 } }
          # /webcam/healthz is deliberately NOT routed — pathType: Exact on
          # the three paths above means it's simply unmatched and 404s at
          # the ingress. Kubelet still probes it directly, pod-internal.
