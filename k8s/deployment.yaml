# Template: `make deploy` fills the ${...} placeholders via k8s/render.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webcam
  labels:
    app: webcam
spec:
  replicas: 1
  strategy:
    type: Recreate   # one physical webcam; two pods must never contend for it
  selector:
    matchLabels:
      app: webcam
  template:
    metadata:
      labels:
        app: webcam
    spec:
      # The node with the webcam; `make label-node` applies the label.
      nodeSelector:
        ${WEBCAM_NODE_LABEL_KEY}: "${WEBCAM_NODE_LABEL_VALUE}"
      # Only needed for private packages (`make ghcr-pull-secret`); if it's
      # missing, the kubelet warns and pulls anonymously.
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: streamer
          image: ${REGISTRY}/fishcam-streamer:${TAG}
          imagePullPolicy: Always
          securityContext:
            privileged: true   # unavoidable for USB device access
          envFrom:
            - configMapRef:
                name: webcam-config
          volumeMounts:
            - { name: dev-video0, mountPath: /dev/video0 }
            - { name: dev-snd, mountPath: /dev/snd }
          # /healthz is 503 whenever ffmpeg is down, including between
          # restarts. The 60s liveness window must outlast RESTART_MAX_BACKOFF
          # (CI checks this). No readiness probe: an unready streamer would
          # cut off the broker just when /status should report the outage.
          startupProbe:
            httpGet: { path: /healthz, port: 8081 }
            periodSeconds: 5
            failureThreshold: 24   # up to 2 minutes for the first ffmpeg start
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            periodSeconds: 10
            failureThreshold: 6

        - name: controller
          image: ${REGISTRY}/fishcam-controller:${TAG}
          imagePullPolicy: Always
          # Not exposed by any Service; declared for `kubectl port-forward`.
          ports:
            - containerPort: 8080
          # Liveness only; the broker's readiness gates traffic.
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 20
            failureThreshold: 3
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: STREAMER_URL
              value: "http://127.0.0.1:8081"
            - name: ROUTE_PREFIX
              valueFrom:
                configMapKeyRef: { name: webcam-config, key: ROUTE_PREFIX }
            - name: HMAC_SECRET
              valueFrom:
                secretKeyRef: { name: webcam-hmac, key: HMAC_SECRET }
          securityContext:
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }

        - name: broker
          image: ${REGISTRY}/fishcam-broker:${TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          # The pod's only public entry point.
          readinessProbe:
            httpGet: { path: /healthz, port: 8082 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8082 }
            periodSeconds: 20
            failureThreshold: 3
          env:
            - name: LISTEN_ADDR
              value: ":8082"
            - name: CONTROLLER_URL
              value: "http://127.0.0.1:8080"
            - name: ROUTE_PREFIX
              valueFrom:
                configMapKeyRef: { name: webcam-config, key: ROUTE_PREFIX }
            - name: HMAC_SECRET
              valueFrom:
                secretKeyRef: { name: webcam-hmac, key: HMAC_SECRET }
            - name: TOKENS_FILE
              value: "/etc/broker/tokens.json"
          volumeMounts:
            - name: broker-tokens
              mountPath: /etc/broker
              readOnly: true
          securityContext:
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }

      volumes:
        - name: dev-video0
          hostPath: { path: /dev/video0 }
        - name: dev-snd
          hostPath: { path: /dev/snd }
        - name: broker-tokens
          secret:
            secretName: webcam-broker-tokens
