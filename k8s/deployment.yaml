# A template: ${...} placeholders are filled from deploy.env by k8s/render.sh
# (which `make deploy` runs). Don't apply this file directly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webcam
  labels:
    app: webcam
spec:
  replicas: 1
  strategy:
    type: Recreate   # one physical webcam; two pods must never contend for it
  selector:
    matchLabels:
      app: webcam
  template:
    metadata:
      labels:
        app: webcam
    spec:
      # Pinned to the node the webcam is plugged into: WEBCAM_NODE_LABEL,
      # which `make label-node` applies to that node.
      nodeSelector:
        ${WEBCAM_NODE_LABEL_KEY}: "${WEBCAM_NODE_LABEL_VALUE}"
      # For pulling from GHCR while the packages are private (the default
      # for new packages); create it with `make ghcr-pull-secret`. Once the
      # packages are public this is unused, and a missing secret only makes
      # the kubelet log a warning before pulling anonymously.
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: streamer
          image: ${REGISTRY}/fishcam-streamer:${TAG}
          imagePullPolicy: Always
          securityContext:
            privileged: true   # unavoidable for USB device access
          envFrom:
            - configMapRef:
                name: webcam-config
          volumeMounts:
            - { name: dev-video0, mountPath: /dev/video0 }
            - { name: dev-snd, mountPath: /dev/snd }
          # The streamer's /healthz is 503 whenever ffmpeg isn't running,
          # including the pauses between restarts. So:
          # - Liveness only after 60s of continuous failure (6 x 10s). That
          #   outlasts RESTART_MAX_BACKOFF (30s in the ConfigMap; keep it
          #   below 60s), so ordinary restarts never trip it, but a pipeline
          #   that never comes back gets the pod restarted, which re-opens
          #   the devices.
          # - No readiness probe, deliberately: an unready streamer would
          #   make the whole pod unready and cut off the broker, exactly when
          #   /status should be reporting that the stream is down.
          startupProbe:
            httpGet: { path: /healthz, port: 8081 }
            periodSeconds: 5
            failureThreshold: 24   # up to 2 minutes for the first ffmpeg start
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            periodSeconds: 10
            failureThreshold: 6

        - name: controller
          image: ${REGISTRY}/fishcam-controller:${TAG}
          imagePullPolicy: Always
          # No Service selects this container's port directly anymore — the
          # broker reaches it over pod loopback only. Left as a distinct
          # containerPort for `kubectl port-forward` during troubleshooting.
          ports:
            - containerPort: 8080
          # Always 200 while the process serves HTTP; liveness only, since
          # the broker's readiness already gates traffic to the pod.
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 20
            failureThreshold: 3
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: STREAMER_URL
              value: "http://127.0.0.1:8081"
            - name: ROUTE_PREFIX
              valueFrom:
                configMapKeyRef: { name: webcam-config, key: ROUTE_PREFIX }
            - name: HMAC_SECRET
              valueFrom:
                secretKeyRef: { name: webcam-hmac, key: HMAC_SECRET }
          securityContext:
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }

        - name: broker
          image: ${REGISTRY}/fishcam-broker:${TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          # The broker is the pod's only public entry point, so its readiness
          # decides whether the Service sends traffic here.
          readinessProbe:
            httpGet: { path: /healthz, port: 8082 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8082 }
            periodSeconds: 20
            failureThreshold: 3
          env:
            - name: LISTEN_ADDR
              value: ":8082"
            - name: CONTROLLER_URL
              value: "http://127.0.0.1:8080"
            - name: ROUTE_PREFIX
              valueFrom:
                configMapKeyRef: { name: webcam-config, key: ROUTE_PREFIX }
            - name: HMAC_SECRET
              valueFrom:
                secretKeyRef: { name: webcam-hmac, key: HMAC_SECRET }
            - name: TOKENS_FILE
              value: "/etc/broker/tokens.json"
          volumeMounts:
            - name: broker-tokens
              mountPath: /etc/broker
              readOnly: true
          securityContext:
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }

      volumes:
        - name: dev-video0
          hostPath: { path: /dev/video0 }
        - name: dev-snd
          hostPath: { path: /dev/snd }
        - name: broker-tokens
          secret:
            secretName: webcam-broker-tokens
