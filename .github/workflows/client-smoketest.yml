name: client smoketest

# Minimal checks for the Flutter app: static analysis, unit and widget
# tests with no network or device, then a compile for web and Android.
#
# Under act (env.ACT is set) Flutter comes from a git checkout via
# ci/flutter-sdk.sh instead of subosito/flutter-action, whose Linux
# downloads are x64-only; that lets this run natively on an arm64
# container. The Android build is skipped under act.

on:
  # Every branch, so feature branches get CI before a PR. No pull_request
  # trigger: for branches in this repo it would run everything a second
  # time, and a PR shows the push runs for its head commit anyway.
  push:
    paths:
      - "client/**"
      - ".github/workflows/client-smoketest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: client

jobs:
  analyze-and-test:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pubspec.lock requires Flutter >= 3.38.4 / Dart >= 3.11, so track
      # stable rather than pinning an older release.
      - uses: subosito/flutter-action@v2
        if: ${{ !env.ACT }}
        with:
          channel: stable
          cache: true

      # FLUTTER goes into $GITHUB_ENV rather than $GITHUB_PATH on purpose:
      # changing the path under act makes it rebuild PATH for later steps.
      - name: Use Flutter from a git checkout (act)
        if: ${{ env.ACT }}
        run: echo "FLUTTER=$GITHUB_WORKSPACE/ci/flutter-sdk.sh" >> "$GITHUB_ENV"

      - run: '"${FLUTTER:-flutter}" --version'

      - run: '"${FLUTTER:-flutter}" pub get'

      # Warnings and errors fail the job; lint "info" hints are reported
      # but don't block a smoke test.
      - name: flutter analyze
        run: '"${FLUTTER:-flutter}" analyze --no-fatal-infos'

      - name: flutter test
        run: '"${FLUTTER:-flutter}" test --reporter expanded'

  build:
    name: build · ${{ matrix.target }}
    needs: analyze-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [web, android]
    steps:
      - uses: actions/checkout@v7

      # act's image has no Android SDK or JDK, and Google's Linux Android
      # build tools are x86-64 only, so there's no native arm64 route.
      - name: Android build skipped (act)
        if: ${{ matrix.target == 'android' && env.ACT }}
        run: echo "::notice::Android build skipped under act; it runs on GitHub."

      # android/app/build.gradle.kts targets Java 17.
      - if: ${{ matrix.target == 'android' && !env.ACT }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        if: ${{ !env.ACT }}
        with:
          channel: stable
          cache: true

      - name: Use Flutter from a git checkout (act)
        if: ${{ env.ACT && matrix.target != 'android' }}
        run: echo "FLUTTER=$GITHUB_WORKSPACE/ci/flutter-sdk.sh" >> "$GITHUB_ENV"

      - if: ${{ !(matrix.target == 'android' && env.ACT) }}
        run: '"${FLUTTER:-flutter}" pub get'

      - name: flutter build web
        if: matrix.target == 'web'
        # --no-wasm-dry-run skips an extra WebAssembly compatibility compile that
        # this app doesn't use; it costs time and, under act, scarce memory.
        run: '"${FLUTTER:-flutter}" build web --release --no-wasm-dry-run'

      - name: flutter build apk (debug, unsigned)
        if: ${{ matrix.target == 'android' && !env.ACT }}
        run: '"${FLUTTER:-flutter}" build apk --debug'
