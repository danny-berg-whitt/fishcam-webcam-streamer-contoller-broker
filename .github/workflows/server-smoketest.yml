name: server smoketest

# Minimal checks for the server side: each Go component's unit tests and
# image build, a real broker container run with the pod's security
# settings, the k8s manifests, and an end-to-end run of broker -> controller
# -> stub streamer to prove the two halves of the HMAC scheme agree.
#
# Every job also runs locally under act on an arm64 host with no x86
# emulation (see README, "Running CI locally"). Steps that differ under act
# are guarded with env.ACT, which act sets and GitHub never does.

on:
  push:
    branches: [dev]
    paths:
      - "broker/**"
      - "streamer/**"
      - "controller/**"
      - "k8s/**"
      - "ci/**"
      - ".github/workflows/server-smoketest.yml"
  pull_request:
    paths:
      - "broker/**"
      - "streamer/**"
      - "controller/**"
      - "k8s/**"
      - "ci/**"
      - ".github/workflows/server-smoketest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  broker:
    name: broker · fmt, vet, test, cross-compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: broker
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: broker/go.mod
          cache: false # the broker has no dependencies, so there is nothing to cache

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -race needs cgo and a C compiler. GitHub's runners have gcc; act's
      # default image doesn't, so fall back to a plain run there.
      - name: go test
        run: |
          flags=(-count=1 -v)
          if command -v gcc >/dev/null; then
            flags=(-race "${flags[@]}")
          else
            echo "::warning::No C compiler here, so the race detector is off."
          fi
          go test "${flags[@]}" ./...

      - name: Cross-compile for the Pi (linux/arm64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /dev/null .

  broker-image:
    name: broker · image build and container smoke run
    needs: broker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The runtime stage is FROM scratch with no RUN, and the build stage
      # runs on $BUILDPLATFORM, so arm64 builds here without QEMU.
      - name: Build linux/amd64 + linux/arm64 (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: broker
          platforms: linux/amd64,linux/arm64
          push: false
          # The gha cache needs GitHub's cache service, which act lacks.
          cache-from: ${{ !env.ACT && 'type=gha,scope=broker' || '' }}
          cache-to: ${{ !env.ACT && 'type=gha,mode=max,scope=broker' || '' }}

      # No platform given, so this builds for the machine it runs on: amd64
      # on GitHub, arm64 under act on Apple Silicon. Either way the image
      # runs natively in the next steps, with no emulation.
      - name: Load a native image for a local run
        uses: docker/build-push-action@v7
        with:
          context: broker
          load: true
          tags: fishcam-broker:smoke
          cache-from: ${{ !env.ACT && 'type=gha,scope=broker' || '' }}

      - name: Refuses to start without HMAC_SECRET
        run: |
          if docker run --rm fishcam-broker:smoke; then
            echo "::error::broker started without HMAC_SECRET"
            exit 1
          fi

      - name: Run with the pod's securityContext and probe it
        run: |
          set -euo pipefail

          token=$(openssl rand -hex 32)
          hash=$(printf '%s' "$token" | sha256sum | awk '{print $1}')
          tokens_dir="$RUNNER_TEMP/broker-tokens"
          mkdir -p "$tokens_dir"
          printf '{"%s":"ci"}' "$hash" > "$tokens_dir/tokens.json"
          chmod 0755 "$tokens_dir"
          chmod 0644 "$tokens_dir/tokens.json" # readable by uid 65534

          # CONTROLLER_URL points at a closed port, so authenticated calls
          # prove the broker got as far as signing and forwarding (502).
          docker run -d --name broker -p 8082:8082 \
            --read-only --user 65534:65534 --cap-drop ALL \
            --security-opt no-new-privileges \
            -e HMAC_SECRET="$(openssl rand -hex 32)" \
            -e ROUTE_PREFIX=/webcam \
            -e CONTROLLER_URL=http://127.0.0.1:9 \
            -v "$tokens_dir:/etc/broker:ro" \
            fishcam-broker:smoke

          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8082/healthz >/dev/null 2>&1 && break
            sleep 0.5
          done

          fail=0
          check() {
            local want=$1 desc=$2; shift 2
            local got
            got=$(curl -s -o /dev/null -w '%{http_code}' "$@")
            if [ "$got" = "$want" ]; then
              echo "ok   $want  $desc"
            else
              echo "::error::$desc: got HTTP $got, want $want"
              fail=1
            fi
          }
          base=http://localhost:8082
          auth="Authorization: Bearer $token"

          check 200 "healthz is unauthenticated"       "$base/healthz"
          check 404 "healthz is not prefixed"          "$base/webcam/healthz"
          check 401 "no token"                         -X POST "$base/webcam/mute"
          check 401 "unknown token"                    -X POST -H "Authorization: Bearer $(openssl rand -hex 32)" "$base/webcam/mute"
          check 405 "GET cannot mute"                  -H "$auth" "$base/webcam/mute"
          check 404 "unprefixed path is not served"    -X POST -H "$auth" "$base/mute"
          check 502 "valid token reaches the upstream" -H "$auth" "$base/webcam/status"

          docker logs broker 2>&1 | grep -q "loaded 1 user token" \
            || { echo "::error::token file was not loaded"; fail=1; }

          exit $fail

      - name: Broker logs
        if: always()
        run: docker logs broker 2>&1 || true

  manifests:
    name: k8s · manifest schema validation
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
    steps:
      - uses: actions/checkout@v7

      # Picks the build for this machine's architecture, and is called by
      # its full path rather than added to $GITHUB_PATH: under act, adding
      # to the path makes act rebuild PATH for later steps, which is where
      # the earlier "node not found" failure came from.
      - name: Install kubeconform
        run: |
          case "$(uname -m)" in
            x86_64)        arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "::error::no kubeconform build for $(uname -m)"; exit 1 ;;
          esac
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-${arch}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" kubeconform

      - name: Validate schemas
        run: '"$RUNNER_TEMP/kubeconform" -strict -summary -output text k8s/*.yaml'

      # kubeconform can't see that a configMapKeyRef names a key the
      # ConfigMap doesn't define; that only fails at runtime. Uses the
      # machine's own python3 (present on GitHub's runners and in act's
      # image), installing PyYAML into a throwaway venv only if needed.
      - name: Cross-check ConfigMap references
        run: |
          py=python3
          if ! python3 -c 'import yaml' 2>/dev/null; then
            python3 -m venv "$RUNNER_TEMP/venv"
            "$RUNNER_TEMP/venv/bin/pip" install --quiet pyyaml
            py="$RUNNER_TEMP/venv/bin/python"
          fi
          "$py" ci/check_manifest_refs.py

  e2e:
    name: e2e · broker → controller → stub streamer
    needs: [broker, go-component]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: controller/go.mod
          cache: false

      - name: Build controller and broker
        run: |
          go build -C controller -o "$RUNNER_TEMP/controller" .
          go build -C broker     -o "$RUNNER_TEMP/broker" .

      - name: Run the request chain
        run: ci/e2e-smoke.sh "$RUNNER_TEMP/controller" "$RUNNER_TEMP/broker"

  go-component:
    name: ${{ matrix.component }} · vet, test, image build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [streamer, controller]
    steps:
      - uses: actions/checkout@v7

      - name: Is the source in this repo?
        id: src
        run: |
          if [ -f "${{ matrix.component }}/go.mod" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=${{ matrix.component }} not tested::${{ matrix.component }}/go.mod is not in this repository, so its checks were skipped."
          fi

      - if: steps.src.outputs.present == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.component }}/go.mod
          cache-dependency-path: ${{ matrix.component }}/go.*

      - name: gofmt
        if: steps.src.outputs.present == 'true'
        working-directory: ${{ matrix.component }}
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        if: steps.src.outputs.present == 'true'
        working-directory: ${{ matrix.component }}
        run: go vet ./...

      - name: go test
        if: steps.src.outputs.present == 'true'
        working-directory: ${{ matrix.component }}
        run: |
          flags=(-count=1)
          if command -v gcc >/dev/null; then
            flags=(-race "${flags[@]}")
          else
            echo "::warning::No C compiler here, so the race detector is off."
          fi
          go test "${flags[@]}" ./...

      - if: steps.src.outputs.present == 'true'
        uses: docker/setup-buildx-action@v4

      # Native platform only (amd64 on GitHub, arm64 under act on Apple
      # Silicon), so the streamer's `apk` install and its ffmpeg capability
      # assertions never run under emulation. The broker job's multi-arch
      # build already covers cross-building.
      - name: Build image (native platform, not pushed)
        if: steps.src.outputs.present == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          push: false
          cache-from: ${{ !env.ACT && format('type=gha,scope={0}', matrix.component) || '' }}
          cache-to: ${{ !env.ACT && format('type=gha,mode=max,scope={0}', matrix.component) || '' }}
